name: Generar voces naturales (ElevenLabs)

# Graba con Eleven v4 los textos que la app lee en voz alta y los guarda como
# archivos estáticos (public/audio). Cada texto se graba una sola vez: si ya
# tiene audio no se vuelve a pedir. Luego publica la app.
#
# Requiere el secreto ELEVENLABS_API_KEY (Settings → Secrets and variables →
# Actions). La clave nunca se escribe en el código ni en la app publicada.
on:
  workflow_dispatch:
    inputs:
      alcance:
        description: 'todo (lecciones, preguntas, fallos, glosario y luego los códigos completos) o nucleo'
        type: choice
        options: [nucleo, todo]
        default: nucleo
      modelo:
        description: 'Modelo de ElevenLabs'
        type: choice
        options: [eleven_v4, eleven_v4_turbo]
        default: eleven_v4
      max_caracteres:
        description: 'Tope de caracteres en esta corrida (además del saldo del plan)'
        default: '800000'
      voz:
        description: 'ID de una voz de ElevenLabs (opcional; si no, se elige una voz argentina)'
        required: false
        default: ''
      muestra:
        description: 'Sólo grabar muestras de v4 y v4 Turbo para comparar'
        type: boolean
        default: false
  # Cuando cambian los textos, graba sólo lo nuevo (requiere el secreto).
  push:
    branches: [main, claude/pwa-derecho-procesal-penal-454jcu]
    paths:
      - src/data/unidades/**
      - src/data/glosario.ts
      - src/data/codigos/*.json
      - src/lib/locucion.ts

permissions:
  contents: write

concurrency:
  group: voces-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Clave de ElevenLabs
        id: clave
        env:
          SECRETO: ${{ secrets.ELEVENLABS_API_KEY }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -n "$SECRETO" ]; then exit 0; fi
          if [ "$EVENTO" = "push" ]; then
            echo "::notice::Sin el secreto ELEVENLABS_API_KEY no se graban voces nuevas."
            echo "omitir=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Falta el secreto ELEVENLABS_API_KEY (Settings → Secrets and variables → Actions)."
          exit 1

      - name: Muestras para comparar modelos
        if: ${{ inputs.muestra }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOZ: ${{ inputs.voz }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--muestra salida-muestras)
          if [ -n "$VOZ" ]; then ARGS+=(--voz "$VOZ"); fi
          npx vite-node scripts/generar-audios.ts -- "${ARGS[@]}"
          cd salida-muestras
          git init -q -b voces-muestras
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -q -m "Muestras de voz (corrida $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" voces-muestras

      - name: Grabar voces
        id: grabar
        if: ${{ !inputs.muestra && steps.clave.outputs.omitir != '1' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ALCANCE: ${{ inputs.alcance || 'nucleo' }}
          MODELO: ${{ inputs.modelo || 'eleven_v4' }}
          MAX: ${{ inputs.max_caracteres || '200000' }}
          VOZ: ${{ inputs.voz }}
        run: |
          ARGS=(--alcance "$ALCANCE" --modelo "$MODELO" --max "$MAX")
          if [ -n "$VOZ" ]; then ARGS+=(--voz "$VOZ"); fi
          npx vite-node scripts/generar-audios.ts -- "${ARGS[@]}"

      - name: Guardar los audios en el repositorio
        if: ${{ always() && !inputs.muestra && steps.clave.outputs.omitir != '1' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio src/data/audios.json
          if git diff --cached --quiet; then echo "Sin audios nuevos."; exit 0; fi
          git commit -q -m "Voces naturales (ElevenLabs): $(git diff --cached --name-only -- public/audio | wc -l) audios"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done

      - name: Compilar
        if: ${{ !inputs.muestra && steps.clave.outputs.omitir != '1' }}
        run: npm test && npm run build && touch dist/.nojekyll
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publicar
        if: ${{ !inputs.muestra && steps.clave.outputs.omitir != '1' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicar Carpi Penal con voces naturales'
